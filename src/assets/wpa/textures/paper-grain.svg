<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="wpa-textures-paper-grain-title wpa-textures-paper-grain-desc">
  <title id="wpa-textures-paper-grain-title">Cream paper grain texture</title>
  <desc id="wpa-textures-paper-grain-desc">Subtle reusable cream paper grain tile for low-opacity backgrounds.</desc>
  <style>
  :root {
    --wpa-navy: var(--navy, #12303a);
    --wpa-cream: var(--paper, #e7d6ad);
    --wpa-cream-text: var(--cream, #f4e7c7);
    --wpa-brick: var(--brick, #a9412b);
    --wpa-ochre: var(--ochre, #d3922e);
    --wpa-forest: var(--forest, #36543b);
    --wpa-dusty-teal: var(--teal, #557b78);
    --wpa-charcoal: var(--charcoal, #262a27);
  }
  .ink { fill: var(--wpa-ink, var(--wpa-navy)); }
  .paper { fill: var(--wpa-paper, var(--wpa-cream)); }
  .accent { fill: var(--wpa-accent, var(--wpa-brick)); }
  .highlight { fill: var(--wpa-highlight, var(--wpa-ochre)); }
  .secondary { fill: var(--wpa-secondary, var(--wpa-forest)); }
  .teal { fill: var(--wpa-dusty-teal, #557b78); }
  .charcoal { fill: var(--wpa-charcoal, #262a27); }
  .ink-stroke {
    fill: none;
    stroke: var(--wpa-ink, var(--wpa-navy));
    stroke-width: 6;
    stroke-linecap: square;
    stroke-linejoin: miter;
    vector-effect: non-scaling-stroke;
  }
  </style>
  <filter id="paper-grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncA type="table" tableValues="0 .16"/>
    </feComponentTransfer>
  </filter>
  <rect class="paper" width="256" height="256"/>
  <rect class="charcoal" width="256" height="256" filter="url(#paper-grain)" opacity=".18"/>
</svg>
