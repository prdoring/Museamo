apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

// Release secrets come from the local environment or encrypted Actions secrets, never source.
def releaseSigning = ['MUSEAMO_KEYSTORE', 'MUSEAMO_KEY_ALIAS', 'MUSEAMO_STORE_PASSWORD', 'MUSEAMO_KEY_PASSWORD']
def hasReleaseSigning = releaseSigning.every { System.getenv(it) }
def ndkOverride = System.getenv('ANDROID_NDK_HOME')

android {
    namespace = "com.prdoring.museamo"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = '36.0.0'
    if (ndkOverride) {
        ndkPath = new File(ndkOverride).isAbsolute() ? ndkOverride : new File(rootProject.projectDir.parentFile, ndkOverride).absolutePath
    } else {
        ndkVersion = '30.0.14904198'
    }
    defaultConfig {
        applicationId "com.prdoring.museamo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.4.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            localRelease {
                storeFile file(System.getenv('MUSEAMO_KEYSTORE'))
                keyAlias System.getenv('MUSEAMO_KEY_ALIAS')
                storePassword System.getenv('MUSEAMO_STORE_PASSWORD')
                keyPassword System.getenv('MUSEAMO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.localRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }
}
kapt { arguments { arg("room.schemaLocation", "$projectDir/schemas") } }

// Never silently produce an unsigned release APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name == 'assembleRelease' } && !hasReleaseSigning) {
        throw new GradleException('Set MUSEAMO_KEYSTORE, MUSEAMO_KEY_ALIAS, MUSEAMO_STORE_PASSWORD, and MUSEAMO_KEY_PASSWORD for a signed release. See docs/releases.md.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Align transitive legacy jdk7/jdk8 artifacts with the compiler's stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.10')
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.work:work-runtime:2.11.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'com.google.code.gson:gson:2.13.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Every distributable APK includes the same portable core used by the desktop companion.
tasks.register('buildSyncCore', Exec) {
    workingDir rootProject.projectDir.parentFile
    environment 'ANDROID_HOME', System.getenv('ANDROID_HOME') ?: android.sdkDirectory.absolutePath
    def nativeBuild = ['node', 'scripts/build-sync-android.mjs']
    if (project.hasProperty('syncCoreRelease') || gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }) nativeBuild += '--release'
    commandLine nativeBuild
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildSyncCore') }
