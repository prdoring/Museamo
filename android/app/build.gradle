apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

android {
    namespace = "com.prdoring.museamo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.prdoring.museamo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "0.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }
}
kapt { arguments { arg("room.schemaLocation", "$projectDir/schemas") } }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.work:work-runtime:2.11.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'com.google.code.gson:gson:2.13.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Every distributable APK includes the same portable core used by the desktop companion.
tasks.register('buildSyncCore', Exec) {
    workingDir rootProject.projectDir.parentFile
    environment 'ANDROID_HOME', System.getenv('ANDROID_HOME') ?: android.sdkDirectory.absolutePath
    def nativeBuild = ['node', 'scripts/build-sync-android.mjs']
    if (project.hasProperty('syncCoreRelease') || gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }) nativeBuild += '--release'
    commandLine nativeBuild
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildSyncCore') }
