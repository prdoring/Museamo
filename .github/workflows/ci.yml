name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    env:
      # Capacitor 8 requires Xcode 26; avoid the runner's older default Xcode.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run test:ios:distribution
      - name: Test native iOS persistence and platform contracts
        run: npm run test:ios
      - name: Build the iOS simulator app
        run: npm run ios:build
      - name: Check the unsigned iPhone release archive
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Museamo-validation.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/Museamo-validation-derived"
          CODE_SIGNING_ALLOWED=NO archive
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Google no longer serves the legacy `tools` package requested by v3.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"
      - run: npm ci
      - run: npm run test:release
      - run: node --test scripts/build-sync-android.test.mjs
      - run: npm test
      - run: cargo test -p museamo-sync-core --locked
      - run: npm run android:sync-core -- --release
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PsyncCoreRelease
        working-directory: android
  native-tests:
    runs-on: ubuntu-latest
    env:
      SYNC_ANDROID_ABIS: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: sdkmanager "ndk;30.0.14904198"
      - run: npm ci && npm run android:sync
      - run: npm run android:sync-core
        env:
          SYNC_ANDROID_ABIS: x86_64
      - run: chmod +x android/gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/androidTests/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # LLVM's slotted libunwind conflicts with the headers GStreamer needs.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - run: npm run build
      - run: cargo check --workspace --locked
      # Unit/integration tests use a test-only identity provider, never the runner's keychain.
      - run: cargo test --workspace --locked -- --test-threads=1
      - name: Build unsigned validation bundles
        run: npm run desktop:build -- --target ${{ matrix.target }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 7
