name: iPhone TestFlight

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      release_commit:
        type: string
        required: true
      release_version:
        type: string
        required: true
    secrets:
      IOS_DISTRIBUTION_P12_BASE64:
        required: true
      IOS_DISTRIBUTION_P12_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      ASC_API_KEY_BASE64:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      candidate:
        description: Build an iPhone-only candidate from a checked codex branch
        required: true
        default: false
        type: boolean
      upload:
        description: Upload the signed build to Apple TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: museamo-testflight
  queue: max
  cancel-in-progress: false

jobs:
  distribute:
    # Branch candidates require an explicit manual dispatch and exact-commit checks below.
    # Reusable calls inherit the caller's successful own-repo main CI event.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.candidate && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.candidate && startsWith(github.ref, 'refs/heads/codex/')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      MUSEAMO_RELEASE_COMMIT: ${{ inputs.release_commit }}
      MUSEAMO_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Require successful checks for the exact candidate commit
        if: github.event_name == 'workflow_dispatch' && inputs.candidate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' ||
                !context.ref.startsWith('refs/heads/codex/') ||
                !/^[a-f0-9]{40}$/.test(context.sha)) {
              throw new Error('Candidates require a manual dispatch of an own-repository codex branch.');
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha, per_page: 100,
            });
            const checked = data.workflow_runs.find(run =>
              run.head_sha === context.sha && run.status === 'completed' &&
              run.conclusion === 'success' &&
              ['push', 'pull_request', 'workflow_dispatch'].includes(run.event) &&
              run.repository?.full_name === repository &&
              run.head_repository?.full_name === repository);
            if (!checked) throw new Error('This exact candidate commit needs successful own-repository Checks before signing.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: checked.id, filter: 'latest', per_page: 100,
            });
            for (const name of ['tests', 'ios', 'build']) {
              if (!jobs.some(job => job.name === name && job.status === 'completed' && job.conclusion === 'success')) {
                throw new Error(`Candidate Checks must include successful ${name}; skipped checks are insufficient.`);
              }
            }
            core.setOutput('checked-run', checked.id);
            await core.summary.addHeading('Checked iPhone candidate')
              .addRaw(`Commit: ${context.sha}\n\nChecks: ${checked.html_url}\n`).write();
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check signing configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_BASE64: ${{ inputs.upload && secrets.ASC_API_KEY_BASE64 || '' }}
          ASC_KEY_ID: ${{ inputs.upload && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ inputs.upload && secrets.ASC_ISSUER_ID || '' }}
          TESTFLIGHT_UPLOAD: ${{ inputs.upload }}
        run: node scripts/ios-testflight.mjs check
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the native Rust XCFramework
        run: npm run ios:sync-core
      - run: npm run test:ios:distribution
      - run: npm run test:ios:assets
      - run: npm test
      - run: npm run test:ios
      - name: Build and sync the iPhone interface
        run: npm run ios:sync
      - name: Sign and export the iPhone app
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: node scripts/ios-testflight.mjs build
      - name: Keep the signed package and build record
        uses: actions/upload-artifact@v4
        with:
          name: museamo-iphone-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/museamo-testflight/export/*.ipa
            ${{ runner.temp }}/museamo-testflight/build-record.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate and upload to Apple
        if: inputs.upload
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-testflight.mjs upload
      - name: Remove temporary signing credentials
        if: always()
        run: node scripts/ios-testflight.mjs cleanup
